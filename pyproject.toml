[project]
name = "dataagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "navneetpathak1", email = "navneetpathak1909@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.17.1",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
]

[project.scripts]
dataagent = "dataagent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
